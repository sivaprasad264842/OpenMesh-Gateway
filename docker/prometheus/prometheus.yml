global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'openmesh-gateway'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 3s
    static_configs:
      - targets: ['openmesh-gateway:8080']
        labels:
          application: 'openmesh-gateway'
          environment: 'production'
