server:
    port: 8080

spring:
    application:
        name: openmesh-gateway
    data:
        redis:
            host: ${REDIS_HOST:localhost}
            port: ${REDIS_PORT:6379}
            timeout: 2000ms
            connect-timeout: 2000ms
    cloud:
        gateway:
            discovery:
                locator:
                    enabled: false
            routes:
                - id: alpha-service-route
                  uri: ${DOWNSTREAM_ALPHA_URL:http://localhost:8081}
                  predicates:
                      - Path=/service-alpha/**
                  filters:
                      - StripPrefix=1
                      - name: TenantRateLimiter
                        args:
                            replenishRate: 10.0
                            burstCapacity: 20.0
                            requestedTokens: 1
                            tier: PRO
                      - name: CircuitBreaker
                        args:
                            name: alphaCircuitBreaker
                            fallbackUri: forward:/fallback/service-unavailable
                  metadata:
                      requiredScopes:
                          - read

                - id: beta-chaos-service-route
                  uri: ${DOWNSTREAM_BETA_URL:http://localhost:8082}
                  predicates:
                      - Path=/service-beta/**
                  filters:
                      - StripPrefix=1
                      - name: TenantRateLimiter
                        args:
                            replenishRate: 5.0
                            burstCapacity: 10.0
                            requestedTokens: 1
                            tier: FREE
                      - name: CircuitBreaker
                        args:
                            name: betaCircuitBreaker
                            fallbackUri: forward:/fallback/service-unavailable

                - id: public-echo-route
                  uri: ${DOWNSTREAM_ALPHA_URL:http://localhost:8081}
                  predicates:
                      - Path=/public/**
                  filters:
                      - StripPrefix=1
                      - name: TenantRateLimiter
                        args:
                            replenishRate: 20.0
                            burstCapacity: 40.0

resilience4j:
    circuitbreaker:
        configs:
            default:
                slidingWindowType: COUNT_BASED
                slidingWindowSize: 10
                minimumNumberOfCalls: 5
                failureRateThreshold: 50.0
                slowCallRateThreshold: 50.0
                slowCallDurationThreshold: 1500ms
                waitDurationInOpenState: 10s
                permittedNumberOfCallsInHalfOpenState: 3
                automaticTransitionFromOpenToHalfOpenEnabled: true
        instances:
            alphaCircuitBreaker:
                baseConfig: default
            betaCircuitBreaker:
                baseConfig: default
    timelimiter:
        configs:
            default:
                timeoutDuration: 1500ms
                cancelRunningFuture: true
        instances:
            alphaCircuitBreaker:
                baseConfig: default
            betaCircuitBreaker:
                baseConfig: default

management:
    endpoints:
        web:
            exposure:
                include: health,info,prometheus,metrics,gateway,circuitbreakers
    endpoint:
        health:
            show-details: always
        prometheus:
            enabled: true
    metrics:
        export:
            prometheus:
                enabled: true
        distribution:
            percentiles:
                openmesh.gateway.request.duration: 0.5, 0.9, 0.99
            percentiles-histogram:
                openmesh.gateway.request.duration: true
                http.server.requests: true

openmesh:
    security:
        jwt:
            public-key-path: classpath:certs/dev-public-key.pem
            private-key-path: classpath:certs/dev-private-key.pem

logging:
    level:
        root: INFO
        io.openmesh: DEBUG
        org.springframework.cloud.gateway: INFO
        org.springframework.security: INFO
