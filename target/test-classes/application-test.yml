server:
  port: 0

spring:
  application:
    name: openmesh-gateway-test
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false
  data:
    redis:
      host: localhost
      port: 6379

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,gateway,circuitbreakers
  endpoint:
    prometheus:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    export:
      prometheus:
        enabled: true

openmesh:
  security:
    jwt:
      public-key-path: classpath:certs/dev-public-key.pem
      private-key-path: classpath:certs/dev-private-key.pem

logging:
  level:
    root: INFO
    io.openmesh: DEBUG
